# The document portal (the /run/user/$UID/doc folder Flatpak apps get files through)
# quits with status 21 when its FUSE mount is unmounted from outside, and then stays
# down until a Flatpak app asks for a file: uploads and drag-and-drop fail meanwhile.
# Start it again right away instead; the limit stops a loop if it can't mount at all.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=2
