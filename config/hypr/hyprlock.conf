# hyprlock — colors and wallpaper come from the theme (written by waybar/scripts/theme.py)
source = @HOME@/.config/hypr/hyprlock-colors.conf

background {
    path = $wallpaper
    color = $bg0
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    text = $TIME
    color = $fg
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    color = $green
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    size = 320, 56
    outline_thickness = 4
    rounding = 12
    outer_color = $edge_deep
    inner_color = $bg0
    font_color = $fg
    check_color = $green
    capslock_color = $yellow
    fail_color = $red
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = <i>Password…   $LAYOUT[EN,FA]</i>
    fail_text = Wrong password ($ATTEMPTS)   $LAYOUT[EN,FA]
    position = 0, -40
    halign = center
    valign = center
}

# your picture: save any square image as ~/.face
image {
    path = @HOME@/.face
    size = 200
    rounding = 0
    border_size = 0
    position = 0, 330
    halign = center
    valign = center
}
