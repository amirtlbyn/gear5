<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The private bus of the smoke tests (dbus-run-session with this file as its config file).
     The default session config lists the service folders, so GTK's portal call starts
     a second xdg-desktop-portal on the private bus. Its document portal takes over
     /run/user/$UID/doc and unmounts it when the bus closes (Flatpak apps then fail),
     and its xdg-desktop-portal-hyprland segfaults (spec PORTAL). With no service
     folder here, the bus starts nothing. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
