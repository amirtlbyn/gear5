# hyprlock — colors and wallpaper come from the theme (written by waybar/scripts/theme.py)
source = @HOME@/.config/hypr/hyprlock-colors.conf

background {
    path = $wallpaper
    color = $bg0
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# the time and date in the zone the bar clock shows (pinned in the world clock popup),
# not the system's zone
label {
    text = cmd[update:1000] @HOME@/.config/waybar/scripts/clock.sh now +%H:%M
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] @HOME@/.config/waybar/scripts/clock.sh now +"%A, %d %B"
    color = $green
    font_size = 22
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    size = 320, 56
    outline_thickness = 4
    rounding = 12
    outer_color = $edge_deep
    inner_color = $bg0
    font_color = $fg
    check_color = $green
    capslock_color = $yellow
    fail_color = $red
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = <i>Password…   $LAYOUT[EN,FA]</i>
    fail_text = Wrong password ($ATTEMPTS)   $LAYOUT[EN,FA]
    position = 0, -40
    halign = center
    valign = center
}

# battery and what is playing (config/hypr/scripts/lockinfo.sh; empty parts are left out)
label {
    text = cmd[update:5000] @HOME@/.config/hypr/scripts/lockinfo.sh
    color = $fg
    font_size = 15
    font_family = $font
    position = 0, -120
    halign = center
    valign = center
}

# the theme's GIF (Settings > Theme), else none; theme.py writes the path into
# hyprlock-colors.conf.
# reload_time = -1: read once, the GIF's first frame, still (spec LOCKSTILL). hyprlock
# then plants no reload timer: reloading per frame made 0.9.6 abort while locked.
image {
    path = $character
    reload_time = -1
    size = 200
    rounding = 0
    border_size = 0
    position = 0, 330
    halign = center
    valign = center
}
