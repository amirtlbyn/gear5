# hyprlock — Everforest night
background {
    path = @HOME@/.config/hypr/wallpapers/summer-night.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

label {
    text = $TIME
    color = rgb(d3c6aa)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(a7c080)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    size = 320, 56
    outline_thickness = 4
    rounding = 12
    outer_color = rgb(161a1d)
    inner_color = rgb(2d353b)
    font_color = rgb(d3c6aa)
    check_color = rgb(a7c080)
    capslock_color = rgb(dbbc7f)
    fail_color = rgb(e67e80)
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = <i>Password…   $LAYOUT[EN,FA]</i>
    fail_text = Wrong password ($ATTEMPTS)   $LAYOUT[EN,FA]
    position = 0, -40
    halign = center
    valign = center
}

# your picture: save any square image as ~/.face
image {
    path = @HOME@/.face
    size = 200
    rounding = 0
    border_size = 0
    position = 0, 330
    halign = center
    valign = center
}
